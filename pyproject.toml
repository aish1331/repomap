[project]
name = "repomap"
version = "0.1.0"
description = "Build a searchable, git-aware mental map of a codebase."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
repomap = "repomap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
